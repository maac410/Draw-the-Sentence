<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw The Sentence!</title>

    <script type="module" src="../js/main.js"></script>
</head>
<body>
<div id="game_rules_cont">
    <div id="titles_cont"></div>

    <div id="players_cont">
        <p>Select the Number of Players</p>
        <div id="players_btn_cont"> </div>
        <div id="players_text_cont"> </div>
    </div>

    <div id="turns_cont">
        <p>Select the Number of Turns</p>
    </div>

    <button id="confirm_game_button">Confirm Game</button>
    <div id="confirm_error"></div>
</div>
<div id="game_cont" style="display:none">
    <div>
        <p>Player 1 Roll the Dice:</p>
        <button value="0" name="turn" id="dice_button">Roll!</button>
    </div>
    <div>
        <p>Select the Senetence!:</p>
        <div id="sentence_cont"> </div>
        <button id="select_button" disabled>Select Sentence</button>
    </div>
    <div id="points_cont" style="display:none">
        <p>Turn Score:</p>
    </div>
</div>
</body>
</html>
