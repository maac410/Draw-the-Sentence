<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw The Sentence!</title>

    <script type="module" src="../js/roll_dice.js"></script>
    <script type="module" src="../js/list_sentences.js"></script>
</head>
<body>
    <h2>Draw The Sentence!</h2>
    <div>
        <p>Select the Number of Turns</p>
        <span>1</span><input type="radio" value="1" name="turn">
        <span>2</span><input type="radio" value="2" name="turn">
        <span>3</span><input type="radio" value="3" name="turn">
        <span>4</span><input type="radio" value="4" name="turn">
        <span>5</span><input type="radio" value="5" name="turn">
        <span>Other</span><input type="radio" value="other" name="turn"><span><input type="text"></span>       
    </div>
    <div>
        <p>Roll the Dice:</p>
        <button value="0" name="turn" id="dice">Roll!</button>
    </div>
    <div>
        <p>Select the Senetence!:</p>
        <input type="radio" value="1" name="sentences"><span>The dog barked loudly.</span><input type="Button" value="🕮" name="turn" value="🕮">
        <input type="radio" value="2" name="sentences"><span>The sun is bright.</span><input type="Button" value="🕮" name="turn" value="🕮">
    </div>
</body>
</html>
