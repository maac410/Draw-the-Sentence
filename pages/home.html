<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw The Sentence!</title>

    <script type="module" src="../js/roll_dice.js"></script>
    <script type="module" src="../js/list_sentences.js"></script>
    <script type="module" src="../js/confirm_sentence.js"></script>
    <script type="module" src="../js/clicked_button.js"></script>
    <script type="module" src="../js/list_buttons.js"></script>
</head>
<body>
    <h2>Draw The Sentence!</h2>

    <div id="players_cont">
        <p>Select the Number of Players</p>
        <div id="players_btn_cont"> </div>
        <div id="players_text_cont"> </div>
    </div>

    <div id="turns_cont">
        <p>Select the Number of Turns</p>
    </div>

    <div>
        <p>Player 1 Roll the Dice:</p>
        <button value="0" name="turn" id="dice">Roll!</button>
    </div>
    <div>
        <p>Select the Senetence!:</p>
        <div id="sentence_cont"> </div>
        <button id="select_button" disabled>Select Sentence</button>
    </div>
    <div id="points_container" style="display:none">
        <p>Turn Score:</p>
    </div>
</body>
</html>
